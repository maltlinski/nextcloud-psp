name: PHP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: php-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: Lint and unit tests (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHP syntax
        run: composer run lint

      - name: PHPUnit
        run: composer run test:unit

  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocp: ['dev-stable33', 'dev-stable34', 'dev-stable35']
    name: Psalm (${{ matrix.ocp }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "nextcloud/ocp:${{ matrix.ocp }}" --no-interaction --no-progress --ignore-platform-reqs --with-dependencies

      - name: Psalm
        run: composer run psalm -- --monochrome --no-progress --output-format=github

  coding-standard:
    runs-on: ubuntu-latest
    name: PHP coding standard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: php-cs-fixer
        run: composer run cs:check

  info-xml:
    runs-on: ubuntu-latest
    name: info.xml schema
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate appinfo/info.xml
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          curl -sSfL https://apps.nextcloud.com/schema/apps/info.xsd -o info.xsd
          xmllint appinfo/info.xml --schema info.xsd --noout
